<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="16x16" href="/notepad.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Source+Code+Pro:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <title>Bloco de Notas</title>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-sticky-note"></i>
        <h2>Notas</h2>
        <span class="note-count" id="note-count">0</span>
      </div>

      <div class="sidebar-actions">
        <button
          class="icon-btn multi-select-toggle"
          id="multi-select-toggle"
          title="Selecionar múltiplas notas"
        >
          <i class="fas fa-check-double"></i>
        </button>
        <button class="icon-btn" id="new-note-btn" title="Nova Nota">
          <i class="fas fa-plus"></i>
        </button>
        <div class="multi-select-actions" id="multi-select-actions">
          <button id="batch-pin-btn" title="Fixar selecionadas">
            <i class="fas fa-thumbtack"></i>
          </button>
          <button id="batch-archive-btn" title="Arquivar selecionadas">
            <i class="fas fa-archive"></i>
          </button>
          <button
            id="batch-unarchive-btn"
            title="Desarquivar selecionadas"
            style="display: none"
          >
            <i class="fas fa-undo"></i>
          </button>
          <button id="batch-delete-btn" class="btn-danger" title="Excluir selecionadas">
            <i class="fas fa-trash"></i>
          </button>
          <span id="selected-count">0</span>
        </div>
      </div>

      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="active" id="tab-active">
          <i class="fas fa-circle"></i> Ativas
        </button>
        <button class="tab-btn" data-tab="archived" id="tab-archived">
          <i class="fas fa-archive"></i> Arquivadas
        </button>
      </div>

      <div class="sidebar-search">
        <i class="fas fa-search search-icon"></i>
        <input
          type="text"
          id="search-notes"
          placeholder="Buscar notas..."
          autocomplete="off"
        />
        <button class="search-clear" id="search-clear" title="Limpar busca">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="sidebar-filters">
        <div class="filter-group">
          <select id="filter-tag">
            <option value="all">Todas as tags</option>
          </select>
        </div>
        <div class="filter-group">
          <select id="filter-date">
            <option value="all">Todas as datas</option>
            <option value="today">Hoje</option>
            <option value="week">Esta semana</option>
            <option value="month">Este mês</option>
          </select>
        </div>
        <button class="filter-clear hidden" id="filter-clear" title="Limpar filtros">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div id="note-list">
        <div id="saved-notes"></div>
      </div>
    </aside>

    <main id="main-content">
      <header id="top-bar">
        <div class="top-bar-left">
          <button id="toggle-sidebar" class="icon-btn">
            <i class="fas fa-bars"></i>
          </button>
          <h1 id="note-title-display">Bloco de Notas</h1>
        </div>
        <div class="top-bar-right">
          <button
            id="toolbar-toggle"
            class="icon-btn toolbar-toggle-topbar"
            title="Ferramentas"
          >
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <button
            id="focus-mode-btn"
            class="icon-btn"
            title="Modo Foco"
          >
            <i class="fas fa-expand"></i>
          </button>
          <button id="theme-toggle" class="icon-btn" title="Alternar tema">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </header>

      <div id="editor-area">
        <div id="editor-toolbar">
          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="bold" title="Negrito (Ctrl+B)">
              <i class="fas fa-bold"></i>
            </button>
            <button class="toolbar-btn" data-command="italic" title="Itálico (Ctrl+I)">
              <i class="fas fa-italic"></i>
            </button>
            <button class="toolbar-btn" data-command="underline" title="Sublinhado (Ctrl+U)">
              <i class="fas fa-underline"></i>
            </button>
            <button class="toolbar-btn" data-command="strike" title="Tachado">
              <i class="fas fa-strikethrough"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="highlight" title="Realce">
              <i class="fas fa-highlighter"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <input
              type="color"
              id="font-color-picker"
              value="#1a2a2a"
              title="Cor da fonte"
            />
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="bulletList" title="Lista">
              <i class="fas fa-list-ul"></i>
            </button>
            <button class="toolbar-btn" data-command="orderedList" title="Lista numerada">
              <i class="fas fa-list-ol"></i>
            </button>
            <button class="toolbar-btn" data-command="taskList" title="Checklist">
              <i class="fas fa-tasks"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="link" title="Inserir link">
              <i class="fas fa-link"></i>
            </button>
            <button class="toolbar-btn" data-command="image" title="Inserir imagem">
              <i class="fas fa-image"></i>
            </button>
            <button class="toolbar-btn" data-command="attachment" title="Anexar arquivo">
              <i class="fas fa-paperclip"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="emoji" title="Inserir emoji">
              <i class="fas fa-face-smile"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="undo" title="Desfazer (Ctrl+Z)">
              <i class="fas fa-undo"></i>
            </button>
            <button class="toolbar-btn" data-command="redo" title="Refazer (Ctrl+Y)">
              <i class="fas fa-redo"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <select id="font-family-select" title="Fonte">
              <option value="Inter">Inter</option>
              <option value="Arial">Arial</option>
              <option value="Georgia">Georgia</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Courier New">Courier New</option>
              <option value="Verdana">Verdana</option>
              <option value="Roboto">Roboto</option>
              <option value="Poppins">Poppins</option>
              <option value="Montserrat">Montserrat</option>
              <option value="Open Sans">Open Sans</option>
              <option value="Lato">Lato</option>
              <option value="Nunito">Nunito</option>
              <option value="Playfair Display">Playfair Display</option>
              <option value="Source Code Pro">Source Code Pro</option>
              <option value="Oswald">Oswald</option>
            </select>
          </div>

          <div class="toolbar-group">
            <select id="font-size-select" title="Tamanho">
              <option value="12px">12</option>
              <option value="14px">14</option>
              <option value="16px" selected>16</option>
              <option value="18px">18</option>
              <option value="20px">20</option>
              <option value="24px">24</option>
              <option value="28px">28</option>
              <option value="32px">32</option>
              <option value="40px">40</option>
              <option value="48px">48</option>
              <option value="64px">64</option>
            </select>
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="align-left" title="Alinhar à esquerda">
              <i class="fas fa-align-left"></i>
            </button>
            <button class="toolbar-btn" data-command="align-center" title="Centralizar">
              <i class="fas fa-align-center"></i>
            </button>
            <button class="toolbar-btn" data-command="align-right" title="Alinhar à direita">
              <i class="fas fa-align-right"></i>
            </button>
            <button class="toolbar-btn" data-command="align-justify" title="Justificar">
              <i class="fas fa-align-justify"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="outdent" title="Diminuir recuo">
              <i class="fas fa-outdent"></i>
            </button>
            <button class="toolbar-btn" data-command="indent" title="Aumentar recuo">
              <i class="fas fa-indent"></i>
            </button>
          </div>

          <div class="toolbar-group">
            <button class="toolbar-btn" data-command="uppercase" title="MAIÚSCULO">
              <i class="fas fa-font"></i><sup>A</sup>
            </button>
            <button class="toolbar-btn" data-command="lowercase" title="minúsculo">
              <i class="fas fa-font"></i><sub>a</sub>
            </button>
            <button class="toolbar-btn" data-command="capitalize" title="Primeira Letra Maiúscula">
              <i class="fas fa-font"></i><span class="case-preview">Aa</span>
            </button>
          </div>

          <div class="toolbar-group toolbar-group-last">
            <span id="save-indicator" class="save-indicator">
              <i class="fas fa-check-circle"></i>
              <span>Salvo</span>
            </span>
          </div>
        </div>

        <div id="note-search-bar" style="display:none;">
          <i class="fas fa-search"></i>
          <input type="text" id="note-search-input" placeholder="Buscar na nota..." autocomplete="off" />
          <button type="button" title="Fechar busca">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div id="editor"></div>

        <div id="note-stats">
          <div class="stats-left">
            <span id="word-count">Palavras: 0</span>
            <span id="char-count">Caracteres: 0</span>
          </div>
          <div class="stats-right">
            <span id="created-date"></span>
            <span id="edited-date"></span>
          </div>
        </div>

        <div id="note-buttons">
          <button class="btn btn-primary" id="save-note-btn">
            <i class="fas fa-save"></i>
            <span>Salvar</span>
          </button>
          <button class="btn btn-secondary" id="close-note-btn">
            <i class="fas fa-times"></i>
            <span>Fechar</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
